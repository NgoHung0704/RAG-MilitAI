[project]
name = "rag-militai"
version = "0.1.0"
description = "MilitAI — RAG and knowledge-graph assistant over military open-source data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "streamlit",
    "neo4j",
    "chromadb",
    "sentence-transformers",
    "openai",
    "python-dotenv",
    "tqdm",
    "pyyaml>=6.0.3",
    "plotly>=6.8.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "matplotlib>=3.11.0",
]
